plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jooq.jooq-codegen-gradle' version '3.21.7'
}

group = 'ru.itmo'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    runtimeOnly 'org.postgresql:postgresql'
    jooqCodegen 'org.jooq:jooq-meta-extensions:3.21.7'
}

jooq {
    configuration {
        generator {
            database {
                name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                properties {
                    property {
                        key = 'scripts'
                        value = "${projectDir}/src/main/resources/db/migration/*.sql"
                    }
                    property {
                        key = 'sort'
                        value = 'flyway'
                    }
                    property {
                        key = 'defaultNameCase'
                        value = 'lower'
                    }
                }
            }
            target {
                packageName = 'ru.itmo.students.jooq'
                directory = "${buildDir}/generated-sources/jooq"
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDir "${buildDir}/generated-sources/jooq"
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('jooqCodegen')
    options.encoding = 'UTF-8'
}
