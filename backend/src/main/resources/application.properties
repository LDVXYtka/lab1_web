spring.application.name=students
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}

jwt.secret=${JWT_SECRET}
jwt.access-minutes=${JWT_ACCESS_MINUTES:15}
jwt.refresh-days=${JWT_REFRESH_DAYS:7}

admin.username=${ADMIN_USERNAME:admin}
admin.email=${ADMIN_EMAIL:admin@example.com}
admin.password=${ADMIN_PASSWORD}

logging.level.ru.itmo.students=${LOG_LEVEL:INFO}
