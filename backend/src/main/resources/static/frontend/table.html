<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Студенты</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <script src="guard.js"></script>
</head>
<body>
    <header>
        <h1>Студенты</h1>
        <div class="user-panel">
            <span id="current-user"></span>
            <button id="logout-button" type="button">Выйти</button>
        </div>
    </header>
    <main>
        <p id="message" class="message" hidden></p>
        <form class="filters" method="get" action="table.html">
            <div class="form-element">
                <label for="name">ФИО</label>
                <input type="text" id="name" name="name" placeholder="Часть ФИО">
            </div>
            <div class="form-element">
                <label for="group">Группа</label>
                <input type="text" id="group" name="group" placeholder="M3301" maxlength="5">
            </div>
            <div class="form-element">
                <label for="isu">ИСУ</label>
                <input type="text" id="isu" name="isu" placeholder="412345" inputmode="numeric" maxlength="6">
            </div>
            <div class="form-element">
                <label for="dormitory">Общежитие</label>
                <select id="dormitory" name="dormitory">
                    <option value="">Любое</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                </select>
            </div>
            <div class="form-element">
                <label for="room">Комната</label>
                <input type="text" id="room" name="room" placeholder="1203" inputmode="numeric" maxlength="4">
            </div>
            <div class="form-element">
                <label for="term_from">Заселен с</label>
                <input type="date" id="term_from" name="term_from">
            </div>
            <div class="form-element">
                <label for="term_to">Заселен по</label>
                <input type="date" id="term_to" name="term_to">
            </div>
            <div class="form-element">
                <label for="international">Иностранец</label>
                <select id="international" name="international">
                    <option value="">Все</option>
                    <option value="true">Да</option>
                    <option value="false">Нет</option>
                </select>
            </div>
            <div class="form-element">
                <label for="sort">Сортировать по</label>
                <select id="sort" name="sort">
                    <option value="id">Порядку добавления</option>
                    <option value="name">ФИО</option>
                    <option value="group">Группе</option>
                    <option value="isu">ИСУ</option>
                    <option value="dormitory">Общежитию</option>
                    <option value="room">Комнате</option>
                    <option value="term">Дате заселения</option>
                </select>
            </div>
            <div class="form-element">
                <label for="order">Порядок</label>
                <select id="order" name="order">
                    <option value="asc">По возрастанию</option>
                    <option value="desc">По убыванию</option>
                </select>
            </div>
            <div class="filter-buttons">
                <button type="submit">Найти</button>
                <button type="button" onclick="window.location.href='table.html'">Сбросить</button>
            </div>
        </form>
        <div class="info-panel">
            <p id="student-count">Студентов: 0</p>
            <button id="add-button" onclick="window.location.href='form.html'">Добавить студента</button>
        </div>
        <dialog id="delete-dialog">
            <p id="delete-question"></p>
            <div class="dialog-buttons">
                <button id="confirm-delete" type="button">Удалить</button>
                <button id="cancel-delete" type="button">Отмена</button>
            </div>
        </dialog>
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>ФИО</th>
                        <th>Группа</th>
                        <th>ИСУ</th>
                        <th>Общежитие</th>
                        <th>Комната</th>
                        <th>Дата заселения</th>
                        <th>Иностранец</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
        <p id="empty-state" hidden>Студенты не найдены</p>
        <div class="pagination">
            <button id="prev-page" type="button">Назад</button>
            <span id="page-info"></span>
            <button id="next-page" type="button">Вперед</button>
        </div>
    </main>
    <script src="api.js"></script>
    <script src="table.js"></script>
</body>
</html>
