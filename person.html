<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Досье студента</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Добавление студента</h1>
        <button onclick="window.location.href='table.html'">Назад к списку</button>
    </header>
    <main>
        <p id="message" role="status" aria-live="polite" hidden></p>

        <dl id="student-details">
            <div class="wide">
                <dt>ФИО</dt>
                <dd id="name"></dd>
            </div>
            <div>
                <dt>Группа</dt>
                <dd id="group"></dd>
            </div>
            <div>
                <dt>ИСУ</dt>
                <dd id="number"></dd>
            </div>
            <div>
                <dt>Общежитие</dt>
                <dd id="dorm"></dd>
            </div>
            <div>
                <dt>Комната</dt>
                <dd id="room"></dd>
            </div>
            <div>
                <dt>Дата заселения</dt>
                <dd id="date"></dd>
            </div>
            <div>
                <dt>Иностранец</dt>
                <dd id="international"></dd>
            </div>
            <div class="full-width">
                <dt>Заметки</dt>
                <dd id="notes"></dd>
            </div>
        </dl>
        <button id="edit-button">Редактировать</button>
    </main>
    <script src="storage.js"></script>
    <script src="person.js"></script>
</body>
</html>
