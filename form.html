<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление студента</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <header>
        <h1 id="form-title">Добавление студента</h1>
        <button onclick="window.location.href='table.html'">Назад к списку</button>
    </header>
    <main>
        <p id="message" class="message" role="status" aria-live="polite" hidden></p>
        <form id="form">
            <div class="form-element">
                <label for="name">ФИО*</label>
                <input type="text" id="name" name="name" placeholder="Иванов Иван Иванович" required>
                <p id="name-error" hidden></p>
            </div>
            <div class="form-row">
                <div class="form-element">
                    <label for="group">Группа*</label>
                    <input type="text" id="group" name="group" placeholder="P3220" minlength="5" maxlength="5" pattern="[A-Za-z][0-9]{4}" required>
                    <p id="group-error" hidden></p>
                </div>
                <div class="form-element">
                    <label for="isu">ИСУ*</label>
                    <input type="number" id="isu" name="isu" placeholder="338922" minlength="6" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" required>
                    <p id="isu-error" hidden></p>
                </div>
            </div>
            <div class="form-row">
                <div class="form-element">
                    <label for="dorm">Номер общежития*</label>
                    <input type="number" id="dorm" name="dorm" placeholder="1" min="1" max="8" inputmode="numeric" required>
                    <p id="dorm-error" hidden></p>
                </div>
                <div class="form-element">
                    <label for="room">Комната*</label>
                    <input type="number" id="room" name="room" placeholder="101" inputmode="numeric" minlength="3" maxlength="4" pattern="(?:[1-9]|1[0-9]|20)(?:0[1-9]|[1-9][0-9])" required>
                    <p id="room-error" hidden></p>
                </div>
            </div>
            <div class="form-row">
                <div class="form-element">
                    <label for="term">Дата заселения*</label>
                    <input type="date" id="term" name="term" min="1970-01-01" max="2026-12-31" required>
                    <p id="term-error" hidden></p>
                </div>
                <div class="form-element">
                    <label for="international">Иностранец*</label>
                    <input type="checkbox" id="international" name="international">
                </div>
            </div>
            <div class="form-element">
                <label for="note">Заметки</label>
                <textarea id="note" name="note" rows="5" maxlength="2000"></textarea>
                <p id="note-error" hidden></p>
            </div>
                <button type="submit" id="save-button">Сохранить</button>
        </form>
    </main>
    <script src="storage.js" ></script>
    <script src="form.js"></script>
</body>
</html>
