<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<link rel="stylesheet" href="formStyle.css">
<form>
    <div>
        <label for="name">ФИО</label>
        <input type="text" id="name" name="name" placeholder="Иванов Иван Иванович" required>
    </div>
    <div>
        <label for="group">Группа</label>
        <input type="text" id="group" name="group" placeholder="P3220" required>
    </div>
    <div>
        <label for="isu">ИСУ</label>
        <input type="number" id="isu" name="isu" minlength="6" maxlength="6" placeholder="338922" required>
    </div>
    <div>
        <label for="dorm">Номер общежития</label>
        <input type="number" id="dorm" name="dorm" placeholder="18">
    </div>
    <div>
        <label for="room">Комната</label>
        <input type="number" id="room" name="room" placeholder="118">
    </div>
    <div>
        <label for="term">Срок заселения</label>
        <input type="date" id="term" name="term" max="2030-12-31">
    </div>
    <div>
        <label for="international">Является иностранцем?</label>
        <select id="international" name="international" required>
            <option value="" disabled selected>Выберите</option>
            <option value="Yes">Да</option>
            <option value="No">Нет</option>
        </select>
    </div>
    <div>
        <label for="note">Заметки</label>
        <textarea id="note" name="note"></textarea>
    </div>
    <div>
        <button type="submit">Добавить</button>
    </div>
</form>
</body>
</html>
