<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Студенты</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Cтуденты</h1>
    </header>
    <main>
        <div class="info-panel">
            <div>
                <p id="student-count">Всего студентов: 0</p>
            </div>
            <button onclick="window.location.href='form.html'">Добавить студента</button>
        </div>
        <section id="delete-panel" hidden>
            <p id="delete-question"></p>
            <div class="actions">
                <button id="confirm-delete" type="button" class="primary">Удалить</button>
                <button id="cancel-delete" type="button">Отмена</button>
            </div>
        </section>

        <div id="table" class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>ФИО</th>
                        <th>Группа</th>
                        <th>ИСУ</th>
                        <th>Общежитие</th>
                        <th>Комната</th>
                        <th>Дата заселения</th>
                        <th>Иностранец</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
        <p id="empty-state">Студентов пока нет. Добавьте первую запись.</p>
    </main>
    <script src="storage.js"></script>
    <script src="table.js"></script>
</body>
</html>
