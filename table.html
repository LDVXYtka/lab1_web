<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Студенты</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <script src="storage.js" defer></script>
    <script src="table.js" defer></script>
</head>
<body>
    <header class="page-header">
        <a href="table.html" class="site-title">Учёт студентов</a>
    </header>
    <main>
        <div class="page-heading">
            <div>
                <h1>Студенты</h1>
                <p class="muted">Всего студентов: <span id="student-count">0</span></p>
            </div>
            <a href="form.html" class="button primary">Добавить студента</a>
        </div>

        <p id="message" class="message" role="status" aria-live="polite" hidden></p>

        <section id="delete-panel" class="panel delete-panel" aria-labelledby="delete-question" hidden>
            <p id="delete-question"></p>
            <div class="actions">
                <button id="confirm-delete" type="button" class="primary">Удалить</button>
                <button id="cancel-delete" type="button">Отмена</button>
            </div>
        </section>

        <div id="table-scroll" class="table-scroll" tabindex="0" role="region" aria-label="Таблица студентов с прокруткой">
            <table>
                <thead>
                    <tr>
                        <th scope="col">ФИО</th>
                        <th scope="col">Группа</th>
                        <th scope="col">ИСУ</th>
                        <th scope="col">Общежитие</th>
                        <th scope="col">Комната</th>
                        <th scope="col">Дата заселения</th>
                        <th scope="col">Иностранец</th>
                        <th scope="col">Действия</th>
                    </tr>
                </thead>
                <tbody id="students-body"></tbody>
            </table>
        </div>
        <p id="empty-state" class="empty-state">Студентов пока нет. Добавьте первую запись.</p>
    </main>
</body>
</html>
