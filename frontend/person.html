<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Досье студента</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Досье студента</h1>
        <a class="button" href="table.html">Назад к списку</a>
    </header>
    <main>
        <p id="message" class="message" role="status" aria-live="polite" hidden></p>

        <dl id="student-details">
            <div class="wide">
                <dt>ФИО</dt>
                <dd id="name"></dd>
            </div>
            <div>
                <dt>Группа</dt>
                <dd id="group"></dd>
            </div>
            <div>
                <dt>ИСУ</dt>
                <dd id="isu"></dd>
            </div>
            <div>
                <dt>Общежитие</dt>
                <dd id="dormitory"></dd>
            </div>
            <div>
                <dt>Комната</dt>
                <dd id="room"></dd>
            </div>
            <div>
                <dt>Дата заселения</dt>
                <dd id="term"></dd>
            </div>
            <div>
                <dt>Иностранец</dt>
                <dd id="international"></dd>
            </div>
            <div>
                <dt>Заметки</dt>
                <dd id="note"></dd>
            </div>
        </dl>
        <a id="edit-link" class="button" href="form.html">Редактировать</a>
    </main>
    <script src="api.js"></script>
    <script src="person.js"></script>
</body>
</html>
