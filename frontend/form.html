<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление студента</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 id="form-title">Добавление студента</h1>
        <button onclick="window.location.href='table.html'">Назад к списку</button>
    </header>
    <main>
        <p id="message" class="message" hidden></p>
        <form id="form">
            <div class="form-element">
                <label for="name">ФИО*</label>
                <input type="text" id="name" name="name" placeholder="Иванов Иван Иванович" maxlength="100" required>
                <p id="name-error" class="field-error" hidden></p>
            </div>
            <div class="form-row">
                <div class="form-element">
                    <label for="group">Группа*</label>
                    <input type="text" id="group" name="group" placeholder="M3301" maxlength="5" pattern="[A-Z][34][1-4][0-9]{2}" required>
                    <p id="group-error" class="field-error" hidden></p>
                </div>
                <div class="form-element">
                    <label for="isu">ИСУ*</label>
                    <input type="text" id="isu" name="isu" placeholder="412345" inputmode="numeric" maxlength="6" pattern="[1-9][0-9]{5}" required>
                    <p id="isu-error" class="field-error" hidden></p>
                </div>
            </div>
            <div class="form-row">
                <div class="form-element">
                    <label for="dormitory">Номер общежития*</label>
                    <input type="number" id="dormitory" name="dormitory" placeholder="1" min="1" max="8" required>
                    <p id="dormitory-error" class="field-error" hidden></p>
                </div>
                <div class="form-element">
                    <label for="room">Комната*</label>
                    <input type="text" id="room" name="room" placeholder="1203" inputmode="numeric" maxlength="4" pattern="(?:[1-9]|1[0-9]|20)(?:0[1-9]|[1-9][0-9])" required>
                    <p id="room-error" class="field-error" hidden></p>
                </div>
            </div>
            <div class="form-row">
                <div class="form-element">
                    <label for="term">Дата заселения*</label>
                    <input type="date" id="term" name="term" min="1970-01-01" required>
                    <p id="term-error" class="field-error" hidden></p>
                </div>
                <div class="form-element">
                    <label for="international">Иностранец</label>
                    <input type="checkbox" id="international" name="international">
                </div>
            </div>
            <div class="form-element">
                <label for="note">Заметки</label>
                <textarea id="note" name="note" rows="5" maxlength="2000"></textarea>
                <p id="note-error" class="field-error" hidden></p>
            </div>
            <button type="submit" id="save-button">Сохранить</button>
        </form>
    </main>
    <script src="api.js"></script>
    <script src="form.js"></script>
</body>
</html>
